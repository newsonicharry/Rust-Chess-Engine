cargo-features = ["profile-rustflags"]


[[bin]]
name = "chess-engine"
path = "src/main.rs"

# [toolchain]
# channel = "nightly"

[package]
name = "ChessEngine"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.7.2"
portable-atomic = { version = "1.0", features = ["fallback"] }
# cozy-chess = "0.3.4"

[profile.release]
debug = true
opt-level = 3
lto = "thin"
target-cpu = "native"

